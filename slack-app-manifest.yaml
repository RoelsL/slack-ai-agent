display_information:
  name: LiteLLM Slack Assistant
  description: AI assistant using a deployment-controlled LiteLLM proxy
  background_color: "#4A154B"
  long_description: This bot integrates Slack with a deployment-controlled LiteLLM proxy. It supports streaming responses, thread context, read-only scoped uploads, authorized MCP tools, and deployment-local custom actions.
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: LiteLLM Assistant
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - chat:write
      - chat:write.public
      - files:read
      - groups:history
      - groups:read
      - groups:write
      - im:history
      - im:read
      - im:write
      - users:read
      - reactions:read
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.groups
      - message.im
      - member_joined_channel
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
